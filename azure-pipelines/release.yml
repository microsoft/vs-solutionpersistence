trigger: none # We only want to trigger manually or based on resources
pr: none

resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release
  pipelines:
  - pipeline: CI
    source: SolutionPersistence
    trigger:
      tags:
      - auto-release

variables:
- template: GlobalVariables.yml

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    settings:
      # Enforce CFS (Compliant Feed Service) network isolation to satisfy SFI-ES4.2.4.
      # CFSClean blocks public package feed endpoints (nuget.org, npmjs.org, etc.).
      # CFSClean2 blocks PowerShell Gallery endpoints (powershellgallery.com).
      # CFSClean3 blocks Docker, Debian, Hashicorp, SourceForge, and other forbidden endpoints.
      # See https://eng.ms/docs/coreai/devdiv/one-engineering-system-1es/1es-build/networkisolation/resolving-cfs-s360-items
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    sdl:
      sourceAnalysisPool: VSEng-MicroBuildVSStable

    stages:
    - stage: release
      jobs:
      - job: nuget
        displayName: 📦 Push nuget.org packages
        pool:
          name: AzurePipelines-EO
          demands:
          - ImageOverride -equals 1ESPT-Ubuntu22.04
          os: Linux
        templateContext:
          outputs:
          - output: nuget
            displayName: 📦 Push packages to nuget.org
            packagesToPush: '$(Pipeline.Workspace)/CI/deployables-Windows/NuGet/*.nupkg'
            packageParentPath: $(Pipeline.Workspace)/CI/deployables-Windows/NuGet
            allowPackageConflicts: true
            nuGetFeedType: external
            publishFeedCredentials: VisualStudioExtensibility (nuget.org)
        steps:
        - checkout: none
        - download: CI
          artifact: deployables-Windows
          displayName: 🔻 Download deployables-Windows artifact
          patterns: 'NuGet/*'
      - job: github
        displayName: 📢 GitHub release
        dependsOn: nuget
        pool:
          name: AzurePipelines-EO
          demands:
          - ImageOverride -equals 1ESPT-Ubuntu22.04
          os: Linux
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: CI
            artifactName: deployables-Windows
            targetPath: $(Pipeline.Workspace)/CI/deployables-Windows
        steps:
        - checkout: none
        - powershell: |
            Write-Host "##vso[build.updatebuildnumber]$(resources.pipeline.CI.runName)"
            if ('$(resources.pipeline.CI.runName)'.Contains('-')) {
              Write-Host "##vso[task.setvariable variable=IsPrerelease]true"
            } else {
              Write-Host "##vso[task.setvariable variable=IsPrerelease]false"
            }
          displayName: ⚙ Set up pipeline
        - task: GitHubRelease@1
          displayName: 📢 GitHub release (create)
          inputs:
            gitHubConnection: github.com_richardstanton # service connection
            repositoryName: $(Build.Repository.Name)
            target: $(resources.pipeline.CI.sourceCommit)
            tagSource: userSpecifiedTag
            tag: v$(resources.pipeline.CI.runName)
            title: v$(resources.pipeline.CI.runName)
            isDraft: true # After running this step, visit the new draft release, edit, and publish.
            isPreRelease: $(IsPrerelease)
            assets: $(Pipeline.Workspace)/CI/deployables-Windows/NuGet/*.nupkg
            changeLogCompareToRelease: lastNonDraftRelease
            changeLogType: issueBased
            changeLogLabels: |
              [
                { "label" : "breaking change", "displayName" : "Breaking changes", "state" : "closed" },
                { "label" : "bug", "displayName" : "Fixes", "state" : "closed" },
                { "label" : "enhancement", "displayName": "Enhancements", "state" : "closed" }
              ]
